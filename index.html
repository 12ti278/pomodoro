<body class="mode-focus">
  <main class="pomodoro-app" role="application" aria-label="番茄钟计时器">
    <button class="settings-toggle" id="settingsToggle" aria-label="设置">
      ⚙️
    </button>

    <header class="app-header">
      <h1 class="app-title">
        <span class="emoji">🍅</span>
        <span>番茄钟</span>
      </h1>
      <p class="app-subtitle">专注工作，高效生活</p>
    </header>

    <!-- 模式切换 -->
    <nav class="mode-tabs" role="tablist" aria-label="计时模式">
      <button class="mode-tab active" data-mode="focus" role="tab" aria-selected="true">专注</button>
      <button class="mode-tab" data-mode="short" role="tab" aria-selected="false">短休息</button>
      <button class="mode-tab" data-mode="long" role="tab" aria-selected="false">长休息</button>
    </nav>

    <!-- 番茄指示器 -->
    <div class="tomato-indicators" id="tomatoIndicators" aria-label="已完成番茄数">
      <div class="tomato-dot" data-index="0"></div>
      <div class="tomato-dot" data-index="1"></div>
      <div class="tomato-dot" data-index="2"></div>
      <div class="tomato-dot" data-index="3"></div>
    </div>

    <!-- 计时器 -->
    <div class="timer-wrapper">
      <div class="timer-circle">
        <svg viewBox="0 0 280 280" aria-hidden="true">
          <circle class="circle-bg" cx="140" cy="140" r="130"></circle>
          <circle class="circle-progress" id="progressCircle" cx="140" cy="140" r="130"></circle>
        </svg>
        <div class="timer-display">
          <div class="time-text" id="timeDisplay">25:00</div>
          <div class="mode-label" id="modeLabel">专注时间</div>
        </div>
      </div>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="btn btn-icon" id="resetBtn" aria-label="重置">
        ↻
      </button>
      <button class="btn btn-primary" id="toggleBtn" aria-label="开始">
        ▶
      </button>
      <button class="btn btn-icon" id="skipBtn" aria-label="跳过">
        ⏭
      </button>
    </div>

    <!-- 统计 -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="completedCount">0</div>
        <div class="stat-label">已完成</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="focusMinutes">0</div>
        <div class="stat-label">专注分钟</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="sessionLabel">第 1 轮</div>
        <div class="stat-label">当前轮次</div>
      </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row">
        <span class="setting-label">专注时长（分钟）</span>
        <input type="number" class="setting-input" id="focusDuration" min="1" max="120" value="25" />
      </div>
      <div class="setting-row">
        <span class="setting-label">短休息（分钟）</span>
        <input type="number" class="setting-input" id="shortDuration" min="1" max="30" value="5" />
      </div>
      <div class="setting-row">
        <span class="setting-label">长休息（分钟）</span>
        <input type="number" class="setting-input" id="longDuration" min="1" max="60" value="15" />
      </div>
      <div class="setting-row">
        <span class="setting-label">长休息间隔</span>
        <input type="number" class="setting-input" id="longInterval" min="2" max="10" value="4" />
      </div>
    </div>
  </main>

  <script>
    // ========== 配置 ==========
    const CONFIG = {
      focus: 25 * 60,
      short: 5 * 60,
      long: 15 * 60,
      longInterval: 4, // 每 N 个番茄后长休息
    };

    // ========== 状态 ==========
    const state = {
      mode: 'focus',
      timeLeft: CONFIG.focus,
      totalTime: CONFIG.focus,
      isRunning: false,
      intervalId: null,
      completedPomodoros: 0,
      totalFocusMinutes: 0,
      session: 1,
    };

    // ========== DOM 元素 ==========
    const els = {
      body: document.body,
      timeDisplay: document.getElementById('timeDisplay'),
      modeLabel: document.getElementById('modeLabel'),
      progressCircle: document.getElementById('progressCircle'),
      toggleBtn: document.getElementById('toggleBtn'),
      resetBtn: document.getElementById('resetBtn'),
      skipBtn: document.getElementById('skipBtn'),
      modeTabs: document.querySelectorAll('.mode-tab'),
      tomatoDots: document.querySelectorAll('.tomato-dot'),
      completedCount: document.getElementById('completedCount'),
      focusMinutes: document.getElementById('focusMinutes'),
      sessionLabel: document.getElementById('sessionLabel'),
      settingsToggle: document.getElementById('settingsToggle'),
      settingsPanel: document.getElementById('settingsPanel'),
      focusDuration: document.getElementById('focusDuration'),
      shortDuration: document.getElementById('shortDuration'),
      longDuration: document.getElementById('longDuration'),
      longInterval: document.getElementById('longInterval'),
    };

    // 圆周长 2πr, r=130
    const CIRCUMFERENCE = 2 * Math.PI * 130;
    els.progressCircle.style.strokeDasharray = CIRCUMFERENCE;

    // ========== 工具函数 ==========
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function getModeInfo(mode) {
      const map = {
        focus: { label: '专注时间', bodyClass: 'mode-focus', tabLabel: '专注' },
        short: { label: '短休息', bodyClass: 'mode-short', tabLabel: '短休息' },
        long: { label: '长休息', bodyClass: 'mode-long', tabLabel: '长休息' },
      };
      return map[mode];
    }

    function getModeDuration(mode) {
      const map = {
        focus: CONFIG.focus,
        short: CONFIG.short,
        long: CONFIG.long,
      };
      return map[mode];
    }

    // ========== 渲染 ==========
    function render() {
      // 时间显示
      els.timeDisplay.textContent = formatTime(state.timeLeft);

      // 进度环
      const progress = state.timeLeft / state.totalTime;
      const offset = CIRCUMFERENCE * (1 - progress);
      els.progressCircle.style.strokeDashoffset = offset;

      // 模式标签
      const modeInfo = getModeInfo(state.mode);
      els.modeLabel.textContent = modeInfo.label;

      // 按钮图标
      els.toggleBtn.textContent = state.isRunning ? '⏸' : '▶';
      els.toggleBtn.setAttribute('aria-label', state.isRunning ? '暂停' : '开始');

      // 番茄指示器
      const dotsInCurrentRound = state.completedPomodoros % CONFIG.longInterval;
      els.tomatoDots.forEach((dot, i) => {
        dot.classList.toggle('completed', i < dotsInCurrentRound);
      });

      // 统计
      els.completedCount.textContent = state.completedPomodoros;
      els.focusMinutes.textContent = state.totalFocusMinutes;
      els.sessionLabel.textContent = `第 ${state.session} 轮`;

      // 页面标题
      document.title = state.isRunning
        ? `${formatTime(state.timeLeft)} · ${modeInfo.label}`
        : '番茄钟 · Pomodoro Timer';
    }

    // ========== 模式切换 ==========
    function switchMode(mode) {
      if (state.isRunning) {
        pauseTimer();
      }

      state.mode = mode;
      state.totalTime = getModeDuration(mode);
      state.timeLeft = state.totalTime;

      // 更新 body class
      els.body.className = getModeInfo(mode).bodyClass;

      // 更新 tab 状态
      els.modeTabs.forEach(tab => {
        const isActive = tab.dataset.mode === mode;
        tab.classList.toggle('active', isActive);
        tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
      });

      render();
    }

    // ========== 计时器控制 ==========
    function startTimer() {
      if (state.isRunning) return;

      state.isRunning = true;
      state.intervalId = setInterval(tick, 1000);
      render();
    }

    function pauseTimer() {
      if (!state.isRunning) return;

      state.isRunning = false;
      clearInterval(state.intervalId);
      state.intervalId = null;
      render();
    }

    function toggleTimer() {
      if (state.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function resetTimer() {
      pauseTimer();
      state.timeLeft = state.totalTime;
      render();
    }

    function skipTimer() {
      completeCurrentSession();
    }

    // ========== 计时逻辑 ==========
    function tick() {
      state.timeLeft--;

      if (state.mode === 'focus') {
        // 统计专注分钟数（每秒累加，最后统一处理）
      }

      if (state.timeLeft <= 0) {
        completeCurrentSession();
        return;
      }

      render();
    }

    function completeCurrentSession() {
      pauseTimer();
      playNotification();

      if (state.mode === 'focus') {
        // 完成一个番茄
        state.completedPomodoros++;
        state.totalFocusMinutes += Math.round(CONFIG.focus / 60);

        // 判断下一个模式
        if (state.completedPomodoros % CONFIG.longInterval === 0) {
          switchMode('long');
        } else {
          switchMode('short');
        }
      } else {
        // 休息结束，回到专注
        if (state.mode === 'long') {
          state.session++;
        }
        switchMode('focus');
      }
    }

    // ========== 提示音 ==========
    function playNotification() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const ctx = new AudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, ctx.currentTime);
        oscillator.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
        oscillator.frequency.setValueAtTime(800, ctx.currentTime + 0.2);

        gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.5);

        setTimeout(() => ctx.close(), 600);
      } catch (e) {
        // 静默失败
      }
    }

    // ========== 设置 ==========
    function toggleSettings() {
      const isOpen = els.settingsPanel.classList.toggle('open');
      els.settingsToggle.style.transform = isOpen ? 'rotate(45deg)' : '';
    }

    function updateConfig() {
      const focusVal = parseInt(els.focusDuration.value) || 25;
      const shortVal = parseInt(els.shortDuration.value) || 5;
      const longVal = parseInt(els.longDuration.value) || 15;
      const intervalVal = parseInt(els.longInterval.value) || 4;

      CONFIG.focus = Math.max(1, Math.min(120, focusVal)) * 60;
      CONFIG.short = Math.max(1, Math.min(30, shortVal)) * 60;
      CONFIG.long = Math.max(1, Math.min(60, longVal)) * 60;
      CONFIG.longInterval = Math.max(2, Math.min(10, intervalVal));

      // 如果当前未运行，更新当前模式的时间
      if (!state.isRunning) {
        state.totalTime = getModeDuration(state.mode);
        state.timeLeft = state.totalTime;
        render();
      }

      // 更新番茄指示器数量
      updateTomatoDots();

      // 保存到本地存储
      saveSettings();
    }

    function updateTomatoDots() {
      const container = document.getElementById('tomatoIndicators');
      container.innerHTML = '';
      for (let i = 0; i < CONFIG.longInterval; i++) {
        const dot = document.createElement('div');
        dot.className = 'tomato-dot';
        dot.dataset.index = i;
        container.appendChild(dot);
      }
      els.tomatoDots = document.querySelectorAll('.tomato-dot');
      render();
    }

    // ========== 本地存储 ==========
    function saveSettings() {
      try {
        const settings = {
          focus: CONFIG.focus / 60,
          short: CONFIG.short / 60,
          long: CONFIG.long / 60,
          longInterval: CONFIG.longInterval,
          completedPomodoros: state.completedPomodoros,
          totalFocusMinutes: state.totalFocusMinutes,
          session: state.session,
        };
        localStorage.setItem('pomodoro-settings', JSON.stringify(settings));
      } catch (e) {}
    }

    function loadSettings() {
      try {
        const saved = localStorage.getItem('pomodoro-settings');
        if (!saved) return;

        const settings = JSON.parse(saved);
        if (settings.focus) CONFIG.focus = settings.focus * 60;
        if (settings.short) CONFIG.short = settings.short * 60;
        if (settings.long) CONFIG.long = settings.long * 60;
        if (settings.longInterval) CONFIG.longInterval = settings.longInterval;
        if (settings.completedPomodoros) state.completedPomodoros = settings.completedPomodoros;
        if (settings.totalFocusMinutes) state.totalFocusMinutes = settings.totalFocusMinutes;
        if (settings.session) state.session = settings.session;

        // 更新输入框
        els.focusDuration.value = CONFIG.focus / 60;
        els.shortDuration.value = CONFIG.short / 60;
        els.longDuration.value = CONFIG.long / 60;
        els.longInterval.value = CONFIG.longInterval;

        // 更新番茄指示器
        updateTomatoDots();
      } catch (e) {}
    }

    // ========== 事件绑定 ==========
    els.toggleBtn.addEventListener('click', toggleTimer);
    els.resetBtn.addEventListener('click', resetTimer);
    els.skipBtn.addEventListener('click', skipTimer);

    els.modeTabs.forEach(tab => {
      tab.addEventListener('click', () => switchMode(tab.dataset.mode));
    });

    els.settingsToggle.addEventListener('click', toggleSettings);

    [els.focusDuration, els.shortDuration, els.longDuration, els.longInterval].forEach(input => {
      input.addEventListener('change', updateConfig);
      input.addEventListener('blur', updateConfig);
    });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      // 忽略输入框中的按键
      if (e.target.tagName === 'INPUT') return;

      switch (e.code) {
        case 'Space':
          e.preventDefault();
          toggleTimer();
          break;
        case 'KeyR':
          resetTimer();
          break;
        case 'KeyS':
          skipTimer();
          break;
        case 'Digit1':
          switchMode('focus');
          break;
        case 'Digit2':
          switchMode('short');
          break;
        case 'Digit3':
          switchMode('long');
          break;
      }
    });

    // 页面可见性变化时的时间校准
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && state.isRunning) {
        // 记录隐藏时间
        state._hiddenAt = Date.now();
      } else if (!document.hidden && state.isRunning && state._hiddenAt) {
        // 计算经过的秒数
        const elapsed = Math.floor((Date.now() - state._hiddenAt) / 1000);
        if (elapsed > 0) {
          if (state.timeLeft - elapsed <= 0) {
            completeCurrentSession();
          } else {
            state.timeLeft -= elapsed;
            render();
          }
        }
        state._hiddenAt = null;
      }
    });

    // 保存统计数据
    setInterval(() => {
      if (state.mode === 'focus' && state.isRunning) {
        saveSettings();
      }
    }, 30000);

    // ========== 初始化 ==========
    loadSettings();
    state.totalTime = getModeDuration(state.mode);
    state.timeLeft = state.totalTime;
    render();
  </script>
</body>
</html>
